<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Шкала отступов</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 700px; height: 150px; background: #0e1116; font-family: var(--font-sans); color: #e8ecf2; padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  h1 { margin: 0; font: 700 13px/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
  .r { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 60px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px; font: 600 10px/1.2 var(--font-sans); }
  code { font: 500 12px/1.4 ui-monospace, monospace; }
</style></head><body>
<h1>Шкала отступов</h1>
<div style="display:grid;gap:7px"><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">4px</code><span style="height:12px;width:4px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">8px</code><span style="height:12px;width:8px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">12px</code><span style="height:12px;width:12px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">16px</code><span style="height:12px;width:16px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">24px</code><span style="height:12px;width:24px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">32px</code><span style="height:12px;width:32px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">40px</code><span style="height:12px;width:40px;background:var(--pink-500);border-radius:3px"></span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:52px;color:#7d8797">64px</code><span style="height:12px;width:64px;background:var(--pink-500);border-radius:3px"></span></div></div>
</body></html>
