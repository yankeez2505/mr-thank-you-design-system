<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Подписка и пагинация</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }

  code { font: 500 12px/1.4 ui-monospace, monospace; }

<h1>Подписка и пагинация</h1>
<form class="subscribe" onsubmit="return false"><input placeholder="YOUR EMAIL"><button class="b-btn" data-tone="mint">SIGN UP</button></form><div class="dots" style="margin-top:16px"><span aria-current="true"></span><span></span><span></span><span></span></div>
</body></html>
