<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Монограмма</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 700px; height: 170px; background: #0e1116; font-family: var(--font-sans); color: #e8ecf2; padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  h1 { margin: 0; font: 700 13px/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
  .r { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 60px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px; font: 600 10px/1.2 var(--font-sans); }
  code { font: 500 12px/1.4 ui-monospace, monospace; }
</style></head><body>
<h1>Монограмма</h1>
<div class="r" style="gap:20px"><div style="flex:1;height:118px;background:#229CDF;border-radius:10px;display:grid;place-items:center"><img src="../assets/logos/monogram-white.png" style="max-height:80px"></div><div style="flex:1;height:118px;background:#FCF6E0;border-radius:10px;display:grid;place-items:center"><img src="../assets/logos/monogram-pink.png" style="max-height:80px"></div><div style="flex:1;height:118px;background:#fff;border-radius:10px;display:grid;place-items:center"><img src="../assets/logos/monogram-black.png" style="max-height:80px"></div></div>
</body></html>
